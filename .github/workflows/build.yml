name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install pinned Build Tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'

      - name: Check notice assets and lint summaries
        run: |
          python3 scripts/check-license-notices.py
          python3 scripts/test-license-notices.py
          python3 scripts/test-lint-summary.py

      - name: Set up signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release tags require the signing key secret."
            exit 1
          else
            echo "::warning::No signing key secret. The APK is signed with a throwaway debug key."
          fi

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_STORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Delete signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Check APK permissions
        shell: bash
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-permissions.txt"
          sed -n "s/^uses-permission[^:]*: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/apk-permissions.txt" | LC_ALL=C sort -u > "$RUNNER_TEMP/actual-permissions.txt"
          if ! diff -u app/expected-permissions.txt "$RUNNER_TEMP/actual-permissions.txt"; then
            echo "::error::APK permissions changed. Review the merged permissions and update app/expected-permissions.txt deliberately."
            exit 1
          fi

      - name: Rename APK
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Release tag does not match versionName $VERSION"
              exit 1
            fi
            # F-Droid shows this file as the release notes.
            if [[ ! -s "fastlane/metadata/android/en-US/changelogs/$CODE.txt" ]]; then
              echo "::error::Add fastlane/metadata/android/en-US/changelogs/$CODE.txt before tagging"
              exit 1
            fi
          fi
          cp app/build/outputs/apk/release/app-release.apk "SnapKeyMap-$VERSION.apk"

      - name: Lint release
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintRelease

      - name: Summarize advisory lint
        if: always()
        continue-on-error: true
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: bash scripts/lint-summary.sh "$LINT_OUTCOME" app/build/reports "$GITHUB_STEP_SUMMARY"

      - name: Upload lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          if-no-files-found: error
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml

      - name: Report resolved release dependencies
        run: |
          mkdir -p app/build/reports
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > app/build/reports/release-runtime-dependencies.txt

      - name: Upload resolved release dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-dependencies
          path: app/build/reports/release-runtime-dependencies.txt
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: app/build/test-results/testReleaseUnitTest/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SnapKeyMap
          path: SnapKeyMap-*.apk

  reproducibility:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_CERTIFICATE_SHA256: ba44c0072299525318cab39f3f30725339251bca7a612ab8cc92a95c554531f2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: rebuild

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SnapKeyMap
          path: original

      - name: Prepare independent unsigned build
        run: |
          mkdir -p verification
          git -C rebuild rev-parse HEAD > verification/source-commit.txt
          sed -n '/^ *versionName = /p; /^ *versionCode = /p; /^ *buildToolsVersion = /p' rebuild/app/build.gradle.kts > verification/build-versions.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          python3 -m venv "$RUNNER_TEMP/reproducibility-tools"
          "$RUNNER_TEMP/reproducibility-tools/bin/pip" install fdroidserver==2.4.5 apksigcopier==1.1.1
          "$RUNNER_TEMP/reproducibility-tools/bin/python" -c 'from fdroidserver.common import remove_signing_keys; remove_signing_keys("rebuild")'
          git -C rebuild diff > verification/signing-removal.patch

      - name: Rebuild without signing secrets or build caches
        working-directory: rebuild
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/reproducibility-gradle
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache assembleRelease

      - name: Verify signatures and exact APK bytes
        shell: bash
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' rebuild/app/build.gradle.kts)
          ORIGINAL="original/SnapKeyMap-$VERSION.apk"
          UNSIGNED="rebuild/app/build/outputs/apk/release/app-release-unsigned.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$RUNNER_TEMP/reproducibility-tools/bin/fdroid" scanner --exit-code "$ORIGINAL" 2>&1 | tee verification/binary-scan.txt
          sha256sum "$ORIGINAL" "$UNSIGNED" | tee verification/SHA256SUMS
          "$APKSIGNER" verify --verbose --print-certs "$ORIGINAL" | tee verification/original-signature.txt
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            test -n "$RELEASE_CERTIFICATE_SHA256"
            CERTIFICATE=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' verification/original-signature.txt)
            test "${CERTIFICATE,,}" = "${RELEASE_CERTIFICATE_SHA256,,}"
          fi
          "$RUNNER_TEMP/reproducibility-tools/bin/apksigcopier" copy "$ORIGINAL" "$UNSIGNED" verification/signature-copied.apk
          sha256sum verification/signature-copied.apk | tee -a verification/SHA256SUMS
          "$APKSIGNER" verify --verbose --print-certs verification/signature-copied.apk | tee verification/copied-signature.txt
          cmp "$ORIGINAL" verification/signature-copied.apk

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducibility
          path: |
            verification/
            rebuild/app/build/outputs/apk/release/*unsigned.apk

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, reproducibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SnapKeyMap

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: SnapKeyMap-*.apk
          generate_release_notes: true
