name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      # The signing key lives in repository secrets, so every build is signed the same way and
      # new versions install over old ones without losing the one-time log permission.
      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret. The APK is signed with a throwaway debug key."
          fi

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(sed -n 's/^appVersion=//p' gradle.properties)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Release tag does not match appVersion=$VERSION"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "SnapKeyMap-$VERSION.apk"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/build/test-results/testReleaseUnitTest/

      - uses: actions/upload-artifact@v6
        with:
          name: SnapKeyMap
          path: SnapKeyMap-*.apk

      # Pushing a tag like v1.0.0 publishes the APK on the repository's Releases page,
      # which is the easiest place to download it from on the phone.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: SnapKeyMap-*.apk
          generate_release_notes: true
