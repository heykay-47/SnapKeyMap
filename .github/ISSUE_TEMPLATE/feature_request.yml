name: Feature request
description: Suggest a new action or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like SnapKey Map to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
      description: The situation where you would use it.
