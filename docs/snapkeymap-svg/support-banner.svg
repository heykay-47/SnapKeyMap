<svg xmlns="http://www.w3.org/2000/svg" width="720" height="56" viewBox="0 0 720 56" role="img" aria-labelledby="title">
  <title id="title">Find SnapKey Map useful? Support the project and its developer.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#072C86"/>
      <stop offset="1" stop-color="#0657EA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill">
      <rect width="720" height="56" rx="28"/>
    </clipPath>
  </defs>
  <style>
    .shine { animation: sweep 4.5s ease-in-out infinite; }
    .heart { transform-origin: 46px 28px; animation: beat 1.6s ease-in-out infinite; }
    .label { font: 600 17px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #fff; }
    .cta { font: 700 15px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #072C86; }
    @keyframes sweep { 0% { transform: translateX(-260px); } 60%, 100% { transform: translateX(760px); } }
    @keyframes beat { 0%, 40%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 28% { transform: scale(0.96); } }
    @media (prefers-reduced-motion: reduce) { .shine, .heart { animation: none; } .shine { display: none; } }
  </style>
  <g clip-path="url(#pill)">
    <rect width="720" height="56" fill="url(#bg)"/>
    <rect class="shine" x="0" y="0" width="220" height="56" fill="url(#shine)" transform="translate(-260 0)"/>
  </g>
  <path class="heart" fill="#EA4AAA" d="M46 39.5c-.4 0-.8-.1-1.1-.4C39 34 34.5 30.1 34.5 25.2c0-3.7 2.8-6.6 6.3-6.6 2.1 0 4 1 5.2 2.7 1.2-1.7 3.1-2.7 5.2-2.7 3.5 0 6.3 2.9 6.3 6.6 0 4.9-4.5 8.8-10.4 13.9-.3.3-.7.4-1.1.4z"/>
  <text class="label" x="70" y="34">Find SnapKey Map useful? Please support its development.</text>
  <rect x="604" y="12" width="100" height="32" rx="16" fill="#38BCFB"/>
  <text class="cta" x="654" y="33" text-anchor="middle">Support</text>
</svg>
