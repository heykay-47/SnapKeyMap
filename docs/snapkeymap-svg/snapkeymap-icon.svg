<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SnapKey Map icon</title>
  <desc id="desc">A blue key button branching to three mapped actions</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A7CFA"/>
      <stop offset="1" stop-color="#0657EA"/>
    </linearGradient>
    <linearGradient id="keyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BCFB"/>
      <stop offset="1" stop-color="#1689F6"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="88" fill="url(#bg)"/>

  <g fill="none" stroke-linecap="round" stroke-width="24">
    <path d="M241 198 C286 198 274 136 341 136" stroke="#6AD8FF"/>
    <path d="M241 256 H341" stroke="#68CCFF"/>
    <path d="M241 314 C286 314 274 376 341 376" stroke="#77DFFF"/>
  </g>

  <rect x="89" y="88" width="164" height="336" rx="82" fill="#072C86"/>
  <rect x="105" y="104" width="132" height="304" rx="66" fill="#C7F2FF"/>
  <rect x="121" y="120" width="100" height="272" rx="50" fill="url(#keyFill)"/>

  <circle cx="366" cy="136" r="50" fill="#08338F"/>
  <circle cx="366" cy="136" r="18" fill="#FFF"/>

  <circle cx="366" cy="256" r="50" fill="#1499F8"/>
  <circle cx="366" cy="256" r="18" fill="#FFF"/>

  <circle cx="366" cy="376" r="50" fill="#61CEF9"/>
  <circle cx="366" cy="376" r="18" fill="#FFF"/>
</svg>
